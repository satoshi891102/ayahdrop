<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: linear-gradient(135deg, #1A1A2E 0%, #0F0F1F 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, sans-serif;
  color: white;
}
.container {
  text-align: center;
  padding: 60px;
}
.emoji { font-size: 64px; margin-bottom: 20px; }
.title { font-size: 56px; font-weight: 700; color: #C9A84C; margin-bottom: 16px; }
.subtitle { font-size: 28px; color: #E8D5A3; margin-bottom: 40px; opacity: 0.9; }
.features {
  display: flex;
  gap: 40px;
  justify-content: center;
  margin-top: 30px;
}
.feature {
  background: rgba(201, 168, 76, 0.1);
  border: 1px solid rgba(201, 168, 76, 0.3);
  border-radius: 12px;
  padding: 16px 24px;
  font-size: 18px;
  color: #E8D5A3;
}
.url {
  margin-top: 40px;
  font-size: 20px;
  color: rgba(255,255,255,0.5);
}
</style>
</head>
<body>
<div class="container">
  <div class="emoji">🕌</div>
  <div class="title">AyahDrop</div>
  <div class="subtitle">Beautiful Quran Verse Cards for Social Media</div>
  <div class="features">
    <div class="feature">✨ 8 Stunning Styles</div>
    <div class="feature">📖 All 114 Surahs</div>
    <div class="feature">📥 Download PNG</div>
  </div>
  <div class="url">ayahdrop.vercel.app</div>
</div>
</body>
</html>
